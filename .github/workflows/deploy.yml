# Builds the site and publishes it to `master`, which is what GitHub Pages
# serves for amyzhous.github.io. The source lives on this branch; `master`
# holds only the built output.
name: Deploy

on:
  push:
    branches: [source]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

      - name: Publish to master
        run: |
          cp .nojekyll dist/ 2>/dev/null || true   # robots.txt is emitted by the build
          cd dist
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git"
          git fetch -q --depth 1 origin master
          git reset -q --soft FETCH_HEAD
          # Keep previously published assets that this build did not re-emit.
          # Pages caches HTML for several minutes; a browser holding an older
          # page still asks for the hashed CSS and JS it referenced, and if
          # those were deleted the page renders with no styles at all.
          git ls-tree -r --name-only FETCH_HEAD -- assets \
            | while read -r old; do [ -e "$old" ] || git checkout FETCH_HEAD -- "$old"; done
          git add -A
          git commit -q -m "Deploy ${{ github.sha }}" || exit 0
          git push -q origin HEAD:master
