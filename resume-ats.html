<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#FFFFFF">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap">
  <script>
    /* GitHub Pages caches HTML for several minutes while hashed assets come
       and go, so a browser can hold a page whose stylesheet no longer
       exists and render it raw. If ours did not load, fetch the page again
       on a fresh URL, once. */
    addEventListener('load', function () {
      var ok = Array.prototype.some.call(document.styleSheets, function (s) {
        return (s.href || '').indexOf('/assets/') > -1;
      });
      if (ok || /[?&]fresh=/.test(location.search)) return;
      var q = location.search ? location.search + '&' : '?';
      location.replace(location.pathname + q + 'fresh=' + Date.now());
    });
    if (/[?&]fresh=/.test(location.search)) {
      var keep = location.search.replace(/[?&]fresh=\d+/, '').replace(/^&/, '?');
      history.replaceState(null, '', location.pathname + (keep === '?' ? '' : keep));
    }
  </script>
  <!--head-->
  <script type="module" src="/src/scripts/resume-ats.ts"></script>
</head>
<body>
<!--app-->
</body>
</html>
